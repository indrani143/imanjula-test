name: Reuse Workflow

on:
  workflow_call:
    inputs:
      who-to-greet:
        required: true
        type: string
    outputs:
      current-time:
        description: "The current time"
        value: ${{ jobs.call-workflow.outputs.current-time }}

jobs:
  call-workflow:
    runs-on: ubuntu-latest
    outputs:
      current-time: ${{ steps.get-time.outputs.current-time }}
    steps:
      - name: Get current time
        id: get-time
        run: echo "current-time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Greet
        run: echo "Hello ${{ inputs.who-to-greet }}"

  use-output:
    runs-on: ubuntu-latest
    needs: [call-workflow]
    steps:
      - run: echo "Time was ${{ needs.call-workflow.outputs.current-time }}"
